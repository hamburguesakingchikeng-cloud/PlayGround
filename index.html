<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="La Espada Celestial: RPG Retro — una aventura de acción, fantasía y criaturas coleccionables.">
  <title>La Espada Celestial · RPG Retro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Mundo de juego"></canvas>
    <div id="world-fx" aria-hidden="true"></div>

    <div id="boot" class="boot-screen">
      <div class="boot-emblem">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs><linearGradient id="bootGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f2c86b"/><stop offset="1" stop-color="#9b6a25"/></linearGradient></defs>
          <path d="M60 6l7 38 20-12-13 24 23 4-25 10 18 22-27-13-3 31-3-31-27 13 18-22L23 60l23-4L33 32l20 12z" fill="url(#bootGold)" opacity=".95"/>
          <circle cx="60" cy="60" r="7" fill="#0a1020" stroke="url(#bootGold)" stroke-width="2"/>
        </svg>
      </div>
      <h1>LA ESPADA CELESTIAL</h1>
      <p id="boot-status">Invocando el reino…</p>
      <div class="boot-bar"><span id="boot-fill"></span></div>
    </div>

    <div id="hud" class="hidden" aria-live="polite">
      <div class="hud-top">
        <div class="hud-left">
          <div class="char-badge" id="charBadge">
            <div class="char-portrait" id="charPortrait"></div>
            <div class="char-meta">
              <div class="char-line"><span id="charName">Astra</span><b id="charLevel">Nv. 1</b></div>
              <div class="bar hp"><i id="hpFill"></i><span id="hpText">100 / 100</span></div>
              <div class="bar mp"><i id="mpFill"></i><span id="mpText">40 / 40</span></div>
              <div class="bar st"><i id="stFill"></i><span id="stText">100 / 100</span></div>
            </div>
          </div>
          <div class="xp-rail"><i id="xpFill"></i><span id="xpText">0 / 100 XP</span></div>
        </div>
        <div class="hud-right">
          <div class="zone-chip" id="zoneChip"><span class="zone-rune">✦</span><b id="zoneName">Aldea de Lumen</b></div>
          <div class="gold-chip" id="goldChip"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10M9 9h6M9 15h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><b id="goldText">0</b></div>
        </div>
      </div>

      <div class="hud-side">
        <div class="quest-tracker" id="questTracker">
          <div class="tracker-head"><span>✦</span> MISIÓN</div>
          <b id="questTitle">El despertar</b>
          <p id="questObjective">Habla con la Anciana Elara.</p>
        </div>
        <div class="creature-chip" id="creatureChip" title="Criatura activa (R para cambiar)">
          <div class="creature-orb" id="creatureOrb"></div>
          <div class="creature-meta"><b id="creatureName">Sin criatura</b><span id="creatureAbility">—</span></div>
          <div class="creature-cd"><i id="creatureCdFill"></i></div>
        </div>
      </div>

      <div class="boss-bar hidden" id="bossBar">
        <div class="boss-head"><span id="bossPhase">FASE I</span><b id="bossName">Guardián Corrompido</b></div>
        <div class="boss-track"><i id="bossFill"></i></div>
      </div>

      <div id="interactPrompt" class="interact-prompt hidden"></div>
      <div id="toasts" class="toasts"></div>
      <div id="hintBar" class="hint-bar"></div>
    </div>

    <div id="touchControls" class="touch-controls hidden" aria-label="Controles táctiles">
      <div id="joystick" class="joystick">
        <div class="joystick-ring"></div>
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <div class="action-cluster">
        <button class="tbtn tbtn-y" data-touch="y" aria-label="Interactuar"><span>Y</span><small>Acción</small></button>
        <button class="tbtn tbtn-x" data-touch="x" aria-label="Habilidad especial"><span>X</span><small>Magia</small></button>
        <button class="tbtn tbtn-b" data-touch="b" aria-label="Esquivar o bloquear"><span>B</span><small>Esquiva</small></button>
        <button class="tbtn tbtn-a" data-touch="a" aria-label="Atacar"><span>A</span><small>Ataque</small></button>
      </div>
      <div class="touch-top">
        <button class="tbtn mini" data-touch="start" aria-label="Pausa"><span>☰</span><small>Menú</small></button>
        <button class="tbtn mini" data-touch="select" aria-label="Acceso rápido"><span>◈</span><small>Rápido</small></button>
      </div>
      <div class="touch-shoulders">
        <button class="tbtn shoulder" data-touch="l" aria-label="Cambiar arma"><span>L</span><small>Arma</small></button>
        <button class="tbtn shoulder" data-touch="r" aria-label="Cambiar criatura"><span>R</span><small>Criatura</small></button>
      </div>
    </div>

    <div id="ui" class="ui-root"></div>
    <div id="modal" class="modal-root hidden"></div>
    <div id="rotateHint" class="rotate-hint hidden"><div class="rotate-icon">▭</div><b>Mejor en horizontal</b><span>Gira tu dispositivo para una experiencia más cómoda.</span></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
